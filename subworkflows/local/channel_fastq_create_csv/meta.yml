# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: channel_fastq_create_csv
description: Create pipeline samplesheet CSV from metadata using channel operators
keywords:
  - samplesheet
  - csv
  - metadata
components: []
input:
  - ch_collected_meta:
      type: map
      description: >
        Collected channel of meta maps containing sample information

  - pipeline:
      type: string
      description: >
        Name of nf-core pipeline e.g. 'rnaseq'

  - strandedness:
      type: string
      description: >
        Strandedness value for rnaseq pipeline

  - outdir:
      type: string
      description: >
        Output directory for samplesheet files

output:
  - samplesheet:
      type: file
      description: >
        Samplesheet CSV file with metadata for pipeline input
      pattern: "*_samplesheet.csv"

authors:
  - "@maxulysse"
